<!DOCTYPE html>
<html lang="en">

        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' blob:"

    </head>

        <div id="app"></div>
        <script type="module" src="./react/main.tsx"></script>
    </body>
